        Fill: |-
            =ColorValue("#0133A2")
        FontWeight: =FontWeight.Semibold
        Height: =56
        HoverColor: =Color.White
        HoverFill: |-
            =ColorFade(ColorValue("#0133A2"), -10%)
        OnSelect: |-
            =Set(locBusy, true);
            IfError(Set(locN, ParseJSON(GrantedF13.Run("", "", JSON({ op: "create", name: txtNewName.Text, location: txtNewLocation.Text, timeZone: drpNewZone.Selected.Value })).json)), Set(locN, ParseJSON("{""ok"":false,""message"":""No connection. Check your signal and try again.""}")));
            Notify(Text(locN.message), If(Boolean(locN.ok), NotificationType.Success, NotificationType.Error));
            If(Boolean(locN.ok),
                Set(gblPid, Text(locN.projectId)); Reset(txtNewName); Reset(txtNewLocation);
                IfError(

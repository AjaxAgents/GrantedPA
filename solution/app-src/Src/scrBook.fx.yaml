scrBook As screen:
    Fill: |-
        =ColorValue("#E6EAEF")
    LoadingSpinnerColor: |-
        =ColorValue("#0133A2")
    OnVisible: |-
        =Set(locShowResult, false); ClearCollect(colSlots,
            ForAll(Sequence(RoundDown(((Value(Left(gblCfg.GateClose, 2)) * 60 + Value(Right(gblCfg.GateClose, 2))) - (Value(Left(gblCfg.GateOpen, 2)) * 60 + Value(Right(gblCfg.GateOpen, 2)))) / gblCfg.SlotMinutes, 0), 0) As k,
                With({ m: (Value(Left(gblCfg.GateOpen, 2)) * 60 + Value(Right(gblCfg.GateOpen, 2))) + k.Value * gblCfg.SlotMinutes },
                    With({ slot: Text(RoundDown(m / 60, 0), "00") & ":" & Text(Mod(m, 60), "00") },
                        With({ used: CountIf(colActive, Gate = LookUp(colGates, Name = drpBookGate.Selected.Value).Id && DateText = Text(dpBookDate.SelectedDate, "yyyy-mm-dd") && Slot = slot && Id <> Coalesce(locEditId, -1)),
                               cap: Coalesce(LookUp(colGates, Id = LookUp(colGates, Name = drpBookGate.Selected.Value).Id).Cap, 0),
                               soon: DateAdd(DateTimeValue(Text(dpBookDate.SelectedDate, "yyyy-mm-dd") & " " & slot), 0, TimeUnit.Minutes) < DateAdd(DateAdd(gblNowLocal, DateDiff(gblLoadedAt, Now(), TimeUnit.Minutes), TimeUnit.Minutes), gblCfg.MinNotice, TimeUnit.Hours),
                               closed: !((Weekday(dpBookDate.SelectedDate) - 1) in colWorkDays.Day) || Text(dpBookDate.SelectedDate, "yyyy-mm-dd") in colBlackouts.Day },
                            { Slot: slot, Label: Text(Time(RoundDown(m / 60, 0), Mod(m, 60), 0), "h:mm AM/PM"), Left: Max(0, cap - used), TooSoon: soon, Closed: closed,
                              Open: !soon && !closed && cap - used > 0 })))));
        With({ until: Max(dpBookDate.SelectedDate, Coalesce(LookUp(colActs, Id = First(Split(drpBookActivity.Selected.Value, " · ")).Value).Start, dpBookDate.SelectedDate)) },
            ClearCollect(colZoneRoom, ForAll(colZones As z,
                { Id: z.Id, Name: z.Name, Cap: z.Cap,
                  Left: Max(0, z.Cap - Max(ForAll(Sequence(DateDiff(dpBookDate.SelectedDate, until, TimeUnit.Days) + 1, 0) As d,
                      Sum(Filter(colActive, Zone = z.Id && Id <> Coalesce(locEditId, -1) && From <= DateAdd(dpBookDate.SelectedDate, d.Value, TimeUnit.Days) && DateAdd(dpBookDate.SelectedDate, d.Value, TimeUnit.Days) <= Until), Pallets)), Value)) })));
        If(IsBlank(LookUp(colSlots, Slot = locSlot && Open)), Set(locSlot, Blank()))


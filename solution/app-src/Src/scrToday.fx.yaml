    capTodayList As label:
        Color: |-
            =ColorValue("#5A6478")
        FontWeight: =FontWeight.Semibold
        Height: =28
        PaddingLeft: =0
        PaddingRight: =0
        Size: =11
        Text: |-
            ="TODAY’S DELIVERIES"
        VerticalAlign: =VerticalAlign.Middle
        Width: =592
        X: =24
        Y: =384

    galToday As gallery.galleryVertical:
        Height: =722
        Items: =SortByColumns(Filter(colReq, Date = gblToday && (Status = "Approved" || Status = "Cancelled")), Slot, SortOrder.Ascending)
        Layout: =Layout.Vertical
        ShowScrollbar: =false
        TemplatePadding: =0
        TemplateSize: =92
        Width: =640
        X: =0
        Y: =414

        rctTodayRow As rectangle:
            Fill: =Color.White
            Height: =84
            Width: =592
            X: =24
            Y: =4

        lblTodayTime As label:
            Color: |-
                =ColorValue("#172033")
            FontWeight: =FontWeight.Semibold
            Height: =84
            PaddingLeft: =0
            PaddingRight: =0
            Size: =15
            Text: =ThisItem.Slot
            VerticalAlign: =VerticalAlign.Middle
            Width: =90
            X: =36
            Y: =4

        lblTodayWho As label:
            Color: |-
                =ColorValue("#172033")
            FontWeight: =FontWeight.Normal
            Height: =84
            PaddingLeft: =0
            PaddingRight: =0
            Size: =11
            Text: =ThisItem.Company & Char(10) & ThisItem.Material & " · " & ThisItem.Pallets & " pallets · " & ThisItem.Pass
            VerticalAlign: =VerticalAlign.Middle
            Width: =332
            X: =130
            Y: =4

        lblTodayStatus As label:
            Align: =Align.Center
            Color: =Color.White
            Fill: |-
                =With({ p: LookUp(colPasses, Code = ThisItem.Pass) }, If(ThisItem.Status = "Cancelled", ColorValue("#5A6478"), p.Status = "Used", ColorValue("#12804A"), Now() > DateAdd(p.Close, 60, TimeUnit.Minutes), ColorValue("#C2252D"), ColorValue("#0133A2")))
            FontWeight: =FontWeight.Semibold
            Height: =30
            PaddingLeft: =0
            PaddingRight: =0
            Size: =10
            Text: |-
                =With({ p: LookUp(colPasses, Code = ThisItem.Pass) }, If(ThisItem.Status = "Cancelled", "Cancelled", p.Status = "Used", "Arrived", Now() > DateAdd(p.Close, 60, TimeUnit.Minutes), "No-show", "Expected"))
            VerticalAlign: =VerticalAlign.Middle
            Width: =128
            X: =476
            Y: =28

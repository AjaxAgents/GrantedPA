    txtAddCode As text:
        AccessibleLabel: |-
            ="e.g. DDC2-7HKQ"
        BorderColor: |-
            =ColorValue("#DCE2EC")
        Default: |-
            =""
        Fill: |-
            =ColorValue("#F1F3F6")
        FocusedBorderColor: |-
            =ColorValue("#0133A2")
        Height: =52
        HintText: |-
            ="e.g. DDC2-7HKQ"
        HoverBorderColor: |-
            =ColorValue("#0133A2")
        PaddingLeft: =12
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8

            ="Back"
        Color: =Color.White
        Height: =56
        OnSelect: =Back()
        PaddingBottom: =10
        PaddingLeft: =10
        PaddingRight: =10
        PaddingTop: =10
        Tooltip: |-
            ="Back"
        Width: =56
        X: =8
        Y: =36

    hdrTeamTitle As label:

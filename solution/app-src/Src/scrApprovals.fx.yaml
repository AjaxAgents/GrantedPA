    capApprReview As label:
        Color: |-
            =ColorValue("#5A6478")
        FontWeight: =FontWeight.Semibold
        Height: =28
        PaddingLeft: =0
        PaddingRight: =0
        Size: =11
        Text: |-
            ="DELIVERIES TO REVIEW · " & CountRows(Filter(colReq, Status = "Needs review"))
        VerticalAlign: =VerticalAlign.Middle
        Width: =592
        X: =24
        Y: =galJoin.Y + galJoin.Height + 12

    galReview As gallery.galleryVertical:
        Height: =1136 - Self.Y
        Items: =SortByColumns(Filter(colReq, Status = "Needs review"), DateText, SortOrder.Ascending)
        Layout: =Layout.Vertical
        ShowScrollbar: =false
        TemplatePadding: =0
        TemplateSize: =330
        Width: =640
        X: =0
        Y: =capApprReview.Y + 30

        rctReview As rectangle:
            Fill: =Color.White
            Height: =318
            Width: =592
            X: =24
            Y: =6

        lblReviewWho As label:
            Color: |-
                =ColorValue("#172033")
            FontWeight: =FontWeight.Semibold
            Height: =32
            PaddingLeft: =0
            PaddingRight: =0
            Size: =14
            Text: =ThisItem.Company & " – " & ThisItem.Material
            VerticalAlign: =VerticalAlign.Middle
            Width: =560
            X: =40
            Y: =14

        lblReviewWhen As label:
            Color: |-
                =ColorValue("#5A6478")
            FontWeight: =FontWeight.Normal
            Height: =28
            PaddingLeft: =0
            PaddingRight: =0
            Size: =11
            Text: =Text(ThisItem.Date, "ddd m/d") & " " & ThisItem.Slot & " · gate " & ThisItem.Gate & " · zone " & ThisItem.Zone & " · " & ThisItem.Pallets & " pallets"
            VerticalAlign: =VerticalAlign.Middle
            Width: =560
            X: =40
            Y: =46

        lblReviewWhy As label:
            Color: |-
                =ColorValue("#172033")
            FontWeight: =FontWeight.Normal
            Height: =100
            PaddingLeft: =0
            PaddingRight: =0
            Size: =11
            Text: |-
                =ThisItem.Reasons & If(IsBlank(ThisItem.Justification), "", Char(10) & "Justification: " & ThisItem.Justification)
            VerticalAlign: =VerticalAlign.Top
            Width: =560
            X: =40
            Y: =76

        txtReviewNote As text:
            AccessibleLabel: |-
                ="Note to the contractor (optional)"
            BorderColor: |-
                =ColorValue("#DCE2EC")

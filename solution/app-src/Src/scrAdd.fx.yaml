        Text: |-
            ="Join or create a project"
        VerticalAlign: =VerticalAlign.Middle
        Width: =540
        X: =68
        Y: =34

    hdrAddSub As label:
        Color: |-
            =ColorValue("#C9D6F2")
        FontWeight: =FontWeight.Normal
        Height: =30
        PaddingLeft: =0
        PaddingRight: =0
        Size: =12
        Text: |-
            ="Projects use a code to join. Admins approve each person."
        VerticalAlign: =VerticalAlign.Middle
        Width: =540
        X: =68
        Y: =74

    capJoin As label:
        Color: |-
            =ColorValue("#5A6478")
        FontWeight: =FontWeight.Semibold
        Height: =28
        PaddingLeft: =0
        PaddingRight: =0

    btnGateDeny As button:
        BorderColor: =Color.White
        BorderThickness: =0
        Color: |-
            =ColorValue("#C2252D")
        DisabledBorderColor: |-
            =ColorValue("#B8C2D6")
        DisabledColor: =Color.White
        DisabledFill: |-
            =ColorValue("#B8C2D6")

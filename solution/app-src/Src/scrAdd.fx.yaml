scrAdd As screen:
    Fill: =Color.White
    LoadingSpinnerColor: |-
        =ColorValue("#0133A2")

    hdrAddBar As rectangle:
        Fill: |-
            =ColorValue("#0133A2")
        Height: =128
        Width: =640
        X: =0
        Y: =0

    hdrAddBack As icon.ChevronLeft:
        AccessibleLabel: |-
            ="Back"
        Color: =Color.White
        Height: =56
        OnSelect: =Back()
        PaddingBottom: =10
        PaddingLeft: =10
        PaddingRight: =10
        PaddingTop: =10
        Tooltip: |-
            ="Back"
        Width: =56
        X: =8
        Y: =36

    hdrAddTitle As label:
        Color: =Color.White
        FontWeight: =FontWeight.Semibold
        Height: =40
        PaddingLeft: =0
        PaddingRight: =0
